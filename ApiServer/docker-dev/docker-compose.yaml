networks:
  dev-net-1:
    external: true
services:
  api:
    container_name: laravel-docker-api
    build:
      context: ..
      dockerfile: docker-dev/Dockerfile
    image: laravel-docker-api
    restart: unless-stopped
    tty: true
    ports:
      - "9009:9009"
    env_file:
      - ../.env
    environment:
      SERVICE_NAME: api
      SERVICE_TAGS: production
      APP_ENV: production
      APP_DEBUG: "false"
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - octane:start
      - --server=frankenphp
      - --host=0.0.0.0
      - --port=9009
    networks:
      - dev-net-1